<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ikrautas – Batch Verifier</title>

  <style>
    body { font-family: ui-sans-serif, system-ui, Arial; margin: 24px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    input, button { padding:10px 12px; font-size:14px; }
    button { cursor:pointer; }
    .card { border:1px solid #ddd; border-radius:12px; padding:16px; margin-top:16px; }
    .ok { color: #0a7b2f; font-weight: 800; }
    .bad { color: #b00020; font-weight: 800; }
    .muted { color: #666; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom:1px solid #eee; padding:8px; text-align:left; font-size: 13px; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#f3f3f3; }
    pre { background:#0b0b0b; color:#e7e7e7; padding:12px; border-radius:10px; overflow:auto; }
    .btn-primary { background:#111; color:#fff; border: none; border-radius:10px; }
    .btn-secondary { background:#f3f3f3; border:1px solid #ddd; border-radius:10px; }
    .btn-primary:disabled, .btn-secondary:disabled { opacity:0.5; cursor:not-allowed; }
    .small { font-size:12px; }
    .banner { display:none; border:1px solid #ffd6d6; background:#fff3f3; color:#7a0010; padding:12px; border-radius:10px; margin-top:12px; white-space:pre-wrap; }
  </style>

  <!-- MSAL (must load BEFORE we use it) -->
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
</head>

<body>
  <h1>Invoice Batch Verifier</h1>
  <p class="muted">
    Compares Outlook vs Sheets by <b>messageId + attachmentId</b>.
    GREEN only when <b>Missing=0</b> and <b>Extra=0</b>.
  </p>

  <div class="row">
    <label>Date (UTC):</label>
    <input id="date" type="date" />

    <button class="btn-secondary" id="btnLogin">Login (Microsoft)</button>
    <button class="btn-secondary" id="btnCheck" disabled>Check batch</button>
    <button class="btn-primary" id="btnSend" disabled>Send to n8n</button>

    <span id="statusPill" class="pill muted">Booting…</span>
  </div>

  <div id="banner" class="banner"></div>

  <div class="card" id="summaryCard" style="display:none;">
    <h3>Summary</h3>
    <div id="summary"></div>
    <h3>Payload</h3>
    <pre id="payload"></pre>
    <div class="muted small">
      This payload is what gets POSTed to your n8n webhook when you click “Send to n8n”.
    </div>
  </div>

  <div class="card" id="detailsCard" style="display:none;">
    <h3>Details</h3>
    <div id="details"></div>
  </div>

  <script>
    // --- CONFIG ---
    const MS_TENANT_ID = "bfc9924e-c574-4dad-ae2d-a46d1b6f1a1a";
    const MS_CLIENT_ID = "6cedc510-3762-48d6-8a08-fee6df75cc07";

    // --- DOM ---
    const dateEl = document.getElementById('date');
    const btnLogin = document.getElementById('btnLogin');
    const btnCheck = document.getElementById('btnCheck');
    const btnSend = document.getElementById('btnSend');
    const statusPill = document.getElementById('statusPill');
    const banner = document.getElementById('banner');

    const summaryCard = document.getElementById('summaryCard');
    const detailsCard = document.getElementById('detailsCard');
    const summaryEl = document.getElementById('summary');
    const payloadEl = document.getElementById('payload');
    const detailsEl = document.getElementById('details');

    const now = new Date();
    dateEl.value = `${now.getUTCFullYear()}-${String(now.getUTCMonth()+1).padStart(2,'0')}-${String(now.getUTCDate()).padStart(2,'0')}`;

    let lastCheck = null;
    let account = null;

    function setStatus(text, ok=null) {
      statusPill.textContent = text;
      statusPill.className = 'pill ' + (ok === true ? 'ok' : ok === false ? 'bad' : 'muted');
    }

    function showBanner(msg) {
      banner.style.display = 'block';
      banner.textContent = msg;
    }

    function hideBanner() {
      banner.style.display = 'none';
      banner.textContent = '';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function renderKeyTable(list) {
      if (!list || list.length === 0) return '<div class="muted">None</div>';
      const rows = list.slice(0, 200).map(x => `
        <tr>
          <td>${escapeHtml(x.messageId || '')}</td>
          <td>${escapeHtml(x.attachmentId || '')}</td>
          <td>${escapeHtml(x.name || '')}</td>
          <td>${escapeHtml(x.contentType || '')}</td>
        </tr>`).join('');
      return `
        <table>
          <thead><tr><th>messageId</th><th>attachmentId</th><th>name</th><th>contentType</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${list.length > 200 ? `<div class="muted">Showing first 200 of ${list.length}</div>` : ''}`;
    }

    // --- MSAL INIT ---
    if (!window.msal) {
      setStatus("MSAL not loaded ❌", false);
      showBanner(
        "MSAL library failed to load.\n\n" +
        "Check:\n" +
        "1) Adblock/Brave shields blocking alcdn.msauth.net\n" +
        "2) Corporate firewall\n" +
        "3) CSP headers blocking scripts\n\n" +
        "Open DevTools -> Console for details."
      );
      btnLogin.disabled = true;
    } else {
      setStatus("Ready (not logged in)", null);
    }

    const msalConfig = {
      auth: {
        clientId: MS_CLIENT_ID,
        authority: `https://login.microsoftonline.com/${MS_TENANT_ID}`,
        // You registered https://...vercel.app/ (with slash) so match it exactly:
        redirectUri: window.location.origin + "/",
      },
      cache: { cacheLocation: "localStorage" },
    };

    const loginRequest = {
      scopes: ["openid", "profile", "offline_access", "Mail.Read"],
    };

    const msalInstance = window.msal ? new msal.PublicClientApplication(msalConfig) : null;

    async function initMsal() {
      if (!msalInstance) return;

      try {
        // If we used redirect flow, this completes it:
        const resp = await msalInstance.handleRedirectPromise();
        if (resp?.account) {
          account = resp.account;
        }
      } catch (e) {
        console.error("handleRedirectPromise error:", e);
        showBanner("handleRedirectPromise error:\n" + (e?.message || String(e)));
      }

      const accounts = msalInstance.getAllAccounts();
      if (!account && accounts.length) account = accounts[0];

      if (account) {
        setStatus(`Logged in: ${account.username}`, true);
        btnCheck.disabled = false;
      } else {
        setStatus("Not logged in", null);
        btnCheck.disabled = true;
      }
    }

    async function login() {
      hideBanner();
      if (!msalInstance) return;

      setStatus("Logging in…", null);

      // Popup first; if blocked, fallback to redirect
      try {
        const resp = await msalInstance.loginPopup(loginRequest);
        account = resp.account;
        setStatus(`Logged in: ${account.username}`, true);
        btnCheck.disabled = false;
      } catch (e) {
        console.error("loginPopup failed:", e);

        const msg = e?.message || String(e);
        // common popup issues -> redirect fallback
        if (msg.toLowerCase().includes("popup") || msg.toLowerCase().includes("blocked")) {
          showBanner("Popup blocked. Falling back to redirect login…");
          await msalInstance.loginRedirect(loginRequest);
          return; // redirect will happen
        }

        setStatus("Login failed ❌", false);
        showBanner("Login failed:\n" + msg);
      }
    }

    async function getToken() {
      if (!account) {
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length) account = accounts[0];
      }
      if (!account) throw new Error("Not logged in.");

      try {
        const resp = await msalInstance.acquireTokenSilent({ ...loginRequest, account });
        return resp.accessToken;
      } catch (e) {
        // popup fallback
        const resp = await msalInstance.acquireTokenPopup({ ...loginRequest, account });
        return resp.accessToken;
      }
    }

    btnLogin.addEventListener("click", (e) => {
      e.preventDefault();
      login();
    });

    btnCheck.addEventListener("click", async () => {
      btnSend.disabled = true;
      setStatus("Checking…", null);
      hideBanner();

      summaryCard.style.display = 'none';
      detailsCard.style.display = 'none';

      try {
        const date = dateEl.value;
        const token = await getToken();

        const res = await fetch(`/api/check?date=${encodeURIComponent(date)}&debug=1`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        const data = await res.json().catch(() => ({}));
        lastCheck = data;

        summaryCard.style.display = 'block';
        detailsCard.style.display = 'block';

        if (!res.ok || data.error) {
          setStatus("ERROR ❌", false);
          summaryEl.innerHTML = `<div class="bad">${escapeHtml(data.error || "Request failed")}</div>`;
          payloadEl.textContent = JSON.stringify(data, null, 2);
          detailsEl.innerHTML = '';
          return;
        }

        summaryEl.innerHTML = `
          <div class="row">
            <div><b>Date:</b> ${data.date}</div>
            <div><b>Expected (Outlook):</b> ${data.expected_total}</div>
            <div><b>Sheets unique:</b> ${data.sheets_unique_total}</div>
            <div><b>Missing:</b> ${data.missing_count}</div>
            <div><b>Extra:</b> ${data.extra_count}</div>
          </div>
          <div class="row" style="margin-top:8px;">
            <div><b>Recognized unique:</b> ${data.recognized_unique}</div>
            <div><b>Unrecognized unique:</b> ${data.unrecognized_unique}</div>
            <div><b>Outlook messages:</b> ${data.messages_count}</div>
            <div><b>Mode:</b> ${data.mode}</div>
          </div>
        `;

        payloadEl.textContent = JSON.stringify(data.payload, null, 2);

        detailsEl.innerHTML = `
          <div class="row">
            <div><b>Status:</b> <span class="${data.ready ? 'ok' : 'bad'}">${data.ready ? 'READY ✅' : 'NOT READY ❌'}</span></div>
            <div class="muted">READY only when Missing=0 and Extra=0</div>
          </div>

          <h4>Missing (Outlook expected but not found in Sheets):</h4>
          ${renderKeyTable(data.missing)}

          <h4>Extra (in Sheets but not in Outlook expected set):</h4>
          ${renderKeyTable(data.extra)}

          <h4>Debug logs</h4>
          <pre>${escapeHtml(JSON.stringify(data.logs || [], null, 2))}</pre>
        `;

        setStatus(data.ready ? "READY ✅" : "NOT READY ❌", data.ready);
        btnSend.disabled = !data.ready;

      } catch (e) {
        console.error(e);
        setStatus("ERROR ❌", false);
        showBanner(e?.message || String(e));
      }
    });

    btnSend.addEventListener("click", async () => {
      if (!lastCheck?.ready) return;

      btnSend.disabled = true;
      setStatus("Sending…", null);

      const res = await fetch('/api/trigger', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(lastCheck.payload),
      });

      const out = await res.json().catch(() => ({}));
      if (out.ok) {
        setStatus("Sent ✅", true);
      } else {
        setStatus("Send failed ❌", false);
        showBanner(out.error || "Send failed");
        btnSend.disabled = false;
      }
    });

    initMsal();
  </script>
</body>
</html>
